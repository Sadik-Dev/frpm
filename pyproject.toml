[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frpm"
version = "0.1.0"
description = "Turn a YouTube video into a curated facial identity/expression reference pack for AI image generation (FLUX/PuLID/InstantID/LoRA workflows) - runs fully locally, CPU-friendly, no cloud APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FRPM Contributors" }]
keywords = [
    "computer-vision",
    "face-detection",
    "face-recognition",
    "lora",
    "stable-diffusion",
    "identity-reference",
    "youtube",
    "dataset-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "yt-dlp>=2024.8.6",
    "opencv-contrib-python>=4.9.0.80",
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "Pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "ImageHash>=4.3.1",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "Jinja2>=3.1.3",
    "imageio-ffmpeg>=0.4.9",
    "requests>=2.31.0",
    "truststore>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
generate = [
    "torch>=2.2.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.2",
]

[project.scripts]
frpm = "frpm.cli:main"

[project.urls]
Homepage = "https://github.com/Sadik-Dev/frpm"
Repository = "https://github.com/Sadik-Dev/frpm"
Issues = "https://github.com/Sadik-Dev/frpm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that require real models/network/video (deselected by default)",
]
addopts = "-m 'not slow'"
testpaths = ["tests"]
